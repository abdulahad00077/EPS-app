name: Build and Release Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch: # Allow manual trigger as backup

jobs:
  build:
    name: EAS Build and GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Create .env file
        run: |
          echo "${{ secrets.ENV_FILE }}" > .env

      - name: Install dependencies
        run: npm ci

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Expo Prebuild
        run: npx expo prebuild --platform android

      - name: Build APK
        working-directory: ./android
        run: ./gradlew assembleRelease

      - name: Rename APK
        run: mv android/app/build/outputs/apk/release/app-release.apk app-release.apk

      - name: Get Version
        id: get_version
        run: |
          CURRENT_VERSION=$(node -p "require('./app.json').expo.version")
          echo "VERSION=$CURRENT_VERSION" >> $GITHUB_ENV

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}-${{ github.run_number }}
          name: v${{ env.VERSION }} (Build ${{ github.run_number }})
          files: app-release.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
